<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TaskTap — Reset Password</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="account-flow.css"></head>
<body>
<header class="topbar"><a class="brand" href="index.html"><span class="brand-mark"><span></span><i></i></span>Task<span>Tap</span></a><a class="back" href="auth.html?mode=login">← Back to Login</a></header>
<main class="flow-page"><div class="flow-card">
<div class="flow-icon green">✓</div><div class="steps"><b class="done">✓</b><i class="done"></i><b class="active">2</b><i></i><b>3</b></div>
<h1>Create a new password</h1><p class="intro">Choose a strong password you haven't used before.</p>
<form id="resetForm">
<label>New Password<div class="password-wrap"><input id="newPassword" required minlength="8" type="password" placeholder="At least 8 characters"><button type="button" class="eye" data-target="newPassword">◉</button></div></label>
<div class="strength"><span></span><span></span><span></span><span></span><small id="strengthText">Enter a password</small></div>
<label>Confirm New Password<div class="password-wrap"><input id="confirmPassword" required type="password" placeholder="Re-enter your password"><button type="button" class="eye" data-target="confirmPassword">◉</button></div></label>
<p class="match" id="match"></p>
<ul class="rules"><li>At least 8 characters</li><li>Include a number or special character</li></ul>
<button class="btn primary full">Reset Password</button>
</form>
<p class="help">After resetting your password, you'll be able to sign in again.</p>
</div></main><script src="account-flow.js"></script></body></html>
